apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: workforce-require-non-root
  annotations:
    policies.kyverno.io/title: Require non-root containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - dev
      validate:
        failureAction: Enforce
        message: Containers in the dev namespace must set runAsNonRoot to true.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: workforce-disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: critical
spec:
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - dev
      validate:
        failureAction: Enforce
        message: Privileged containers are not permitted in the dev namespace.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.privileged || false }}"
                    operator: Equals
                    value: true

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: workforce-require-resources
  annotations:
    policies.kyverno.io/title: Require resource requests and limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  background: true
  rules:
    - name: require-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - dev
      validate:
        failureAction: Enforce
        message: Every container must define CPU and memory requests and limits.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: workforce-disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest image tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  background: true
  rules:
    - name: require-versioned-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - dev
      validate:
        failureAction: Enforce
        message: Container images must use an explicit tag other than latest.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('.*:latest$', element.image) }}"
                    operator: Equals
                    value: true
                  - key: "{{ regex_match('^[^:@]+$', element.image) }}"
                    operator: Equals
                    value: true
